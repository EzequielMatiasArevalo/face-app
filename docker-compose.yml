
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend
    ports:
      - "8000:8000"
    volumes:
      - ./.env.docker.example:/app/.env
      - ./src:/app
      - ./models:/app/models
      - ./output:/app/output
      - ./data:/app/data
      # Credenciales por defecto de gcloud (solo lectura): el backend las usa únicamente para
      # impersonar a la service account del bucket (GCS_SERVICE_ACCOUNT). Si se renuevan con
      # `gcloud auth application-default login`, hay que recrear el contenedor.
      - ${HOME}/.config/gcloud/application_default_credentials.json:/secrets/gcloud-adc.json:ro
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/gcloud-adc.json
      # Valores propios de cada despliegue: exportados en la shell o definidos en ./.env (ver .env.example)
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      GCS_BUCKET: ${GCS_BUCKET:-}
      GCS_SERVICE_ACCOUNT: ${GCS_SERVICE_ACCOUNT:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["uvicorn", "app.main:app", "--reload", "--host", "0.0.0.0", "--port", "8000"]
  postgres:
    image: pgvector/pgvector:pg17
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-faces}
      POSTGRES_USER: ${POSTGRES_USER:-faces_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-faces_pass}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-faces_user}", "-d", "${POSTGRES_DB:-faces}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Next.js + Firebase Auth (frontend/). La config de Firebase y la URL del backend se incrustan
  # en el bundle al construir la imagen, a partir de las mismas variables (ver .env.example).
  frontend:
    build:
      context: ./frontend
      args:
        GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
        FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
        FIREBASE_API_KEY: ${FIREBASE_API_KEY:-}
        FIREBASE_APP_ID: ${FIREBASE_APP_ID:-}
        FIREBASE_AUTH_DOMAIN: ${FIREBASE_AUTH_DOMAIN:-}
        BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL:-}
    container_name: frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
